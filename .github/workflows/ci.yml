name: checks
on: [push, pull_request]
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy soundfile 'pydantic>=2,<3'
      - run: python scripts/check_release.py
      - run: python -m pytest -q tests
      - run: python -m compileall -q data_annotation expressive_annotation scripts
