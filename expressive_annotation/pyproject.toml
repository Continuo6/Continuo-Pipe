[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "continuo-expressive"
version = "0.1.0"
description = "Paralinguistic annotation and TTS instruction generation for large speech corpora"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["speech", "tts", "annotation", "paralinguistics", "instruction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Deliberately tiny. Importing the package must not require torch: the heavy deps
# belong to whichever environment runs a given pass, and are pinned per pass in
# requirements/. See README §Install.
dependencies = [
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
annotate = ["torch", "transformers>=4.40,<4.50", "librosa", "pyloudnorm", "penn",
            "loralib==0.1.2", "speechbrain==1.0.3"]
caption = ["torch", "transformers>=4.57", "librosa", "accelerate"]
# vllm backend (default, ~100x faster per GPU than transformers on this model)
caption-vllm = ["torch", "transformers>=4.57", "librosa", "vllm>=0.24"]
# nonverbal vocalizations; the model class comes from the NV-Bench checkout
nv = ["torch", "funasr>=1.3", "librosa"]
dev = ["pytest"]

[project.scripts]
continuo-annotate = "continuo_expressive.cli.annotate:main"
continuo-caption = "continuo_expressive.cli.caption:main"
continuo-firered = "continuo_expressive.cli.firered:main"
continuo-nv = "continuo_expressive.cli.nv:main"

[tool.setuptools.packages.find]
include = ["continuo_expressive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
